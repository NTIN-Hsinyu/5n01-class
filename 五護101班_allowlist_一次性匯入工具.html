<html lang="zh-Hant">
<head>

<title>五護101班｜Allowlist 匯入工具</title>
<style>
:root{--bg:#fff9f5;--card:#fff;--text:#263238;--muted:#748087;--line:#eee7e2;--accent:#4f7cac;--ok:#24715f;--danger:#b64d3a}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;background:var(--bg);color:var(--text)}
.wrap{max-width:900px;margin:auto;padding:28px 18px 60px}.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:24px;margin-bottom:18px}
h1{font-size:27px;margin:0 0 8px}h2{font-size:19px;margin:0 0 14px}p{line-height:1.7;color:var(--muted)}code{font-size:.92em}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}button{border:1px solid var(--line);border-radius:11px;padding:10px 14px;background:#fff;font-weight:800;cursor:pointer}button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}button:disabled{opacity:.5;cursor:not-allowed}
.status{margin-top:14px;padding:12px;border-radius:11px;background:#f7f9fb;line-height:1.6}.ok{color:var(--ok)}.danger{color:var(--danger)}.warning{background:#fff6e4;color:#8a6421}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:left}th{position:sticky;top:0;background:#fff}.table-wrap{max-height:440px;overflow:auto;border:1px solid var(--line);border-radius:12px}.pill{display:inline-block;padding:3px 8px;border-radius:999px;background:#eef5ff;font-size:12px}
@media(max-width:650px){.wrap{padding:16px 10px 40px}.card{padding:18px 14px}h1{font-size:23px}table{font-size:12px}th,td{padding:8px 5px}}

</head>
<body><div class="wrap">
<div class="card">

<p>已依你上傳的班級名單內建 <b>53 位</b>有完整資料的學生。登入導師帳號後，可一次寫入 Firestore <code>allowlist/{email}</code>。</p>
<div class="status warning">注意：原始 Excel 實際有 53 位學生資料，學號由 511501148 直接跳到 511501150，沒有 511501149；最後一列為空白。因此本工具不會自行猜測第 54 位學生。</div>

</div>

const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
const provider=new GoogleAuthProvider();provider.setCustomParameters({hd:"ntin.edu.tw",prompt:"select_account"});
const loginBtn=document.querySelector("#loginBtn"),logoutBtn=document.querySelector("#logoutBtn"),importBtn=document.querySelector("#importBtn"),status=document.querySelector("#status"),tbody=document.querySelector("#rows");
tbody.innerHTML=students.map(s=>`<tr><td>${s.studentId}</td><td>${s.name}</td><td>${s.email}</td><td class="rowStatus">待匯入</td></tr>`).join("");
function setStatus(msg,cls=""){status.className="status "+cls;status.textContent=msg}
loginBtn.onclick=async()=>{try{await signInWithPopup(auth,provider)}catch(e){setStatus("登入失敗："+e.message,"danger")}};
logoutBtn.onclick=()=>signOut(auth);
onAuthStateChanged(auth,async user=>{
 importBtn.disabled=true;
 if(!user){loginBtn.style.display="inline-block";logoutBtn.style.display="none";setStatus("尚未登入。");return}
 loginBtn.style.display="none";logoutBtn.style.display="inline-block";
 const email=(user.email||"").toLowerCase();
 if(!email.endsWith("@ntin.edu.tw")){setStatus("請使用 NTIN 學校帳號。","danger");await signOut(auth);return}
 try{
  const snap=await getDoc(doc(db,"users",user.uid));
  if(!snap.exists()||snap.data().active!==true||snap.data().role!=="advisor"){setStatus("此工具僅開放導師帳號使用。","danger");return}
  setStatus(`已登入：${snap.data().name||user.displayName||email}（導師）。可以開始匯入。`,"ok");importBtn.disabled=false;
 }catch(e){setStatus("無法確認導師權限："+e.message,"danger")}
});
importBtn.onclick=async()=>{
 if(!auth.currentUser)return;
 if(!confirm(`確定將 ${students.length} 位學生寫入五護101班 allowlist？`))return;
 importBtn.disabled=true;importBtn.textContent="匯入中…";
 try{
  const batch=writeBatch(db);
  students.forEach(s=>batch.set(doc(db,"allowlist",s.email),{email:s.email,name:s.name,studentId:s.studentId,active:true}));
  await batch.commit();
  document.querySelectorAll(".rowStatus").forEach(el=>{el.textContent="已匯入";el.classList.add("ok")});
  setStatus(`完成：已將 ${students.length} 位學生寫入 allowlist。`,"ok");importBtn.textContent="已完成匯入";
 }catch(e){console.error(e);setStatus("匯入失敗："+e.message,"danger");importBtn.disabled=false;importBtn.textContent="重新匯入"}
};
</script></body></html>
